# Cross-compilation configuration for roam-helper
# Install cross: just cross-install
# Build: cross build --release --target x86_64-unknown-linux-musl
# Build: cross build --release --target aarch64-unknown-linux-musl
#
# We intentionally rely on cross's default target images so the image tag
# matches the installed cross release instead of pinning a potentially
# incompatible `:main` container.
