# Cross-compilation targets for idev-helper
# Use `cross` tool for musl targets: cargo install cross
# Build: cross build --release --target <target>

[target.x86_64-unknown-linux-musl]
# Produces fully static binary for x86_64 Linux

[target.aarch64-unknown-linux-musl]
# Produces fully static binary for ARM64 Linux (Raspberry Pi, Graviton, etc.)

[profile.release]
opt-level = "z"     # Optimize for size
lto = true          # Link-time optimization
codegen-units = 1   # Single codegen unit for better optimization
strip = true        # Strip symbols
panic = "abort"     # Smaller binary, no unwinding
