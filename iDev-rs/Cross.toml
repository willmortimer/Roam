# Cross-compilation configuration for idev-helper
# Install cross: cargo install cross --git https://github.com/cross-rs/cross
# Build: cross build --release --target x86_64-unknown-linux-musl
# Build: cross build --release --target aarch64-unknown-linux-musl

[target.x86_64-unknown-linux-musl]
image = "ghcr.io/cross-rs/x86_64-unknown-linux-musl:main"

[target.aarch64-unknown-linux-musl]
image = "ghcr.io/cross-rs/aarch64-unknown-linux-musl:main"
